[package]
name = "ffb-parity"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ffb-parity"
path = "src/main.rs"

[[bin]]
name = "ffb-replay"
path = "src/replay/main.rs"

[dependencies]
ffb-model = { path = "../ffb-model" }
ffb-mechanics = { path = "../ffb-mechanics" }
ffb-engine = { path = "../ffb-engine" }
ffb-protocol = { path = "../ffb-protocol" }
ffb-client = { path = "../ffb-client" }
serde = { workspace = true }
serde_json = { workspace = true }
rand_xoshiro = { workspace = true }
rand_core = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
regex = "1"
# zlib backend: the one this workspace already builds (via mysql_common), no new crates
flate2 = { version = "1", default-features = false, features = ["zlib"] }
